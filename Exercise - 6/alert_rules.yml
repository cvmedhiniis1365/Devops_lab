
groups:
  - name: delivery_alerts
    rules:
      - alert: HighPendingDeliveries
        expr: pending_deliveries > 15
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "High number of pending deliveries"
          description: "Pending deliveries have exceeded 15 for 10 seconds."

      - alert: HighDeliveryTime
        expr: rate(average_delivery_time_sum[1m]) > 35
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "High average delivery time"
          description: "Average delivery processing time is elevated."
