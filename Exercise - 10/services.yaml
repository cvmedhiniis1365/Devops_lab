
apiVersion: v1
kind: Service
metadata:
  name: appa-service
spec:
  selector:
    app: appa
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: appb-service
spec:
  selector:
    app: appb
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: NodePort
